<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mis PDF</title>
  <meta name="description" content="Abre archivos PDF, súbelos a Google Drive y compártelos por WhatsApp.">
  <meta name="theme-color" content="#c42828">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ INICIO ============ -->
  <section id="home" class="view active">
    <header class="bar">
      <h1>Mis PDF</h1>
      <div class="bar-actions">
        <button id="btnInstall" class="chip hidden" type="button">Instalar app</button>
        <button id="btnSettings" class="icon-btn" type="button" aria-label="Ajustes">
          <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
        </button>
      </div>
    </header>

    <main class="home-main">
      <label class="open-card" for="filePicker">
        <svg viewBox="0 0 24 24" class="open-ico"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9zM11 18v-3H8v-2h3v-3h2v3h3v2h-3v3z"/></svg>
        <span class="open-title">Abrir PDF</span>
        <span class="open-sub">Elige uno o varios archivos de tu celular</span>
      </label>
      <input id="filePicker" type="file" accept="application/pdf,.pdf" multiple hidden>

      <div class="list-head">
        <h2>Recientes</h2>
        <button id="btnClearAll" class="link-btn hidden" type="button">Borrar todo</button>
      </div>
      <ul id="recentList" class="recent-list"></ul>
      <p id="emptyMsg" class="empty">Aún no has abierto ningún PDF.<br>También puedes compartir un PDF desde WhatsApp, Gmail o Archivos y elegir <b>Mis PDF</b>.</p>
    </main>
  </section>

  <!-- ============ VISOR ============ -->
  <section id="viewer" class="view">
    <header class="bar">
      <button id="btnBack" class="icon-btn" type="button" aria-label="Volver">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <div class="doc-title">
        <span id="docName">documento.pdf</span>
        <small id="pageInfo">—</small>
      </div>
      <div class="bar-actions">
        <button id="btnZoomOut" class="icon-btn" type="button" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
        <button id="btnZoomFit" class="chip" type="button" aria-label="Ajustar al ancho"><span id="zoomLbl">100%</span></button>
        <button id="btnZoomIn" class="icon-btn" type="button" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      </div>
    </header>

    <div id="pagesWrap" class="pages-wrap">
      <div id="pages" class="pages"></div>
      <div id="loading" class="loading">Cargando…</div>
    </div>

    <nav class="action-bar">
      <button id="btnWhats" class="act whats" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/></svg>
        WhatsApp
      </button>
      <button id="btnDrive" class="act drive" type="button">
        <svg viewBox="0 0 24 24"><path d="M8.3 3h7.4l6.3 11-3.7 6.4L12 9.4zM7.2 4.9l3.7 6.4L4.6 22 1 15.6zM9.2 15h12.6l-3.7 6.6H5.5z"/></svg>
        Drive
      </button>
      <button id="btnShare" class="act" type="button">
        <svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.2.9l-7-4.1a3.3 3.3 0 0 0 0-1.6l7-4a3 3 0 1 0-1-2.2 3.3 3.3 0 0 0 .1.8l-7 4.1a3 3 0 1 0 0 4.3l7 4.1a2.8 2.8 0 0 0-.1.7A3 3 0 1 0 18 16z"/></svg>
        Compartir
      </button>
    </nav>
  </section>

  <!-- ============ DIÁLOGOS ============ -->
  <div id="sheet" class="sheet-backdrop hidden">
    <div class="sheet" role="dialog" aria-modal="true">
      <h3 id="sheetTitle"></h3>
      <div id="sheetBody"></div>
      <div id="sheetActions" class="sheet-actions"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="vendor/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
